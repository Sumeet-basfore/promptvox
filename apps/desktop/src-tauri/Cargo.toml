[package]
name = "promptvox-desktop"
version = "0.1.0"
description = "PromptVox Desktop App"
authors = ["PromptVox Team"]
edition = "2021"

[lib]
name = "promptvox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-sql = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
